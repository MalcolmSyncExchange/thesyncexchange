name: Media native amd64 isolation (manual, no hosted secrets)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed repository commit (40 lowercase hex)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: media-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Validate exact source and native host
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(uname -m)" = x86_64
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Build local image and run complete offline adversarial suite
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p /private/tmp/media-native-evidence
          git rev-parse HEAD HEAD^{tree} > /private/tmp/media-native-evidence/source.txt
          docker build --platform linux/amd64 -f workers/media/Dockerfile -t media-native-local . > /private/tmp/media-native-evidence/build.log 2>&1
          docker image inspect media-native-local --format '{{.Id}}' > /private/tmp/media-native-evidence/image.txt
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 2g --cpus 2 --pids-limit 64 --tmpfs /work:rw,size=536870912,uid=1000,gid=1000,mode=0700 --entrypoint /usr/bin/python3 media-native-local workers/media/runtime-kernel-probe.py > /private/tmp/media-native-evidence/kernel.json
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 2g --cpus 2 --pids-limit 64 --tmpfs /work:rw,size=536870912,uid=1000,gid=1000,mode=0700 media-native-local --self-test > /private/tmp/media-native-evidence/tests.log 2>&1
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 2g --cpus 2 --pids-limit 64 --tmpfs /work:rw,size=536870912,uid=1000,gid=1000,mode=0700 --entrypoint /usr/local/bin/node media-native-local tests/media-worker/resource.mjs > /private/tmp/media-native-evidence/resource.json
      - name: Upload safe evidence only (no media, tokens or environment dump)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: media-native-amd64-${{ inputs.source_sha }}
          path: /private/tmp/media-native-evidence/*
          retention-days: 14
