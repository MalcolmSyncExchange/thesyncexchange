name: Next 15 Security Upgrade

on:
  push:
    branches:
      - chore/next15-security-upgrade

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade framework dependencies
        run: |
          npm install --save-exact next@15.5.25 react@19.1.8 react-dom@19.1.8
          npm install --save-dev --save-exact eslint-config-next@15.5.25 @types/react@19 @types/react-dom@19 postcss@8.5.28

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          CONTEXT: deploy-preview
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder

      - name: Audit dependencies
        run: npm audit --json > next15-audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: next15-audit
          path: next15-audit.json
          retention-days: 1

      - name: Commit upgrade if validation passed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade Next.js security baseline"
          git push
