name: Next 15 Security Upgrade

on:
  push:
    branches:
      - chore/next15-security-upgrade

concurrency:
  group: next15-security-upgrade
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install migration dependency graph
        run: npm install

      - name: Migrate async request APIs
        run: npx --yes @next/codemod@15.5.25 next-async-request-api . --force

      - name: Apply Next 15 compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          submit_form = Path("components/forms/submit-music-form.tsx")
          text = submit_form.read_text()
          text = text.replace(
              "refs: Record<string, RefObject<HTMLInputElement>>",
              "refs: Record<string, RefObject<HTMLInputElement | null>>",
          )
          submit_form.write_text(text)

          auth_actions = Path("services/auth/actions.ts")
          text = auth_actions.read_text()
          text = text.replace(
              'import { redirect } from "next/navigation";\nimport { isRedirectError } from "next/dist/client/components/redirect";',
              'import { redirect, unstable_rethrow } from "next/navigation";',
          )
          text = text.replace(
              "    if (isRedirectError(error)) {\n      throw error;\n    }\n\n",
              "    unstable_rethrow(error);\n\n",
          )
          auth_actions.write_text(text)

          buyer_actions = Path("services/buyer/actions.ts")
          text = buyer_actions.read_text()
          text = text.replace(
              'import { redirect } from "next/navigation";\nimport { isRedirectError } from "next/dist/client/components/redirect";',
              'import { redirect, unstable_rethrow } from "next/navigation";',
          )
          text = text.replace(
              "    if (isRedirectError(checkoutError)) {\n      throw checkoutError;\n    }\n\n",
              "    unstable_rethrow(checkoutError);\n\n",
          )
          buyer_actions.write_text(text)
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          CONTEXT: deploy-preview
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder

      - name: Audit dependencies
        run: npm audit --json > next15-audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: next15-audit
          path: next15-audit.json
          retention-days: 1

      - name: Commit upgrade if validation passed
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only -z | xargs -0 git add --
          git commit -m "chore: upgrade Next.js security baseline"
          git push
