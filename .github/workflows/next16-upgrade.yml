name: Next 16 Security Upgrade

on:
  push:
    branches:
      - chore/next16-security-upgrade

concurrency:
  group: next16-security-upgrade
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade framework dependencies
        run: |
          npm install --save-exact next@16.3.5 react@latest react-dom@latest
          npm install --save-dev --save-exact eslint@latest eslint-config-next@16.3.5 @types/react@latest @types/react-dom@latest postcss@latest

      - name: Migrate Next lint to ESLint CLI
        run: npx --yes @next/codemod@16.3.5 next-lint-to-eslint-cli . --force

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          CONTEXT: deploy-preview
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder

      - name: Audit dependencies
        run: npm audit --json > next16-audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: next16-audit
          path: next16-audit.json
          retention-days: 1

      - name: Commit upgrade if validation passed
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only -z | xargs -0 git add --
          git commit -m "chore: upgrade to secure Next.js 16 baseline"
          git push
