name: Security Promotion Rebuild

on:
  push:
    branches:
      - chore/security-promotion

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main-based promotion branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Replay validated Next 16 tree onto current main
        run: |
          git fetch origin chore/next16-security-upgrade:refs/remotes/origin/chore/next16-security-upgrade
          git diff --binary HEAD origin/chore/next16-security-upgrade > /tmp/security-promotion.patch
          git apply --index /tmp/security-promotion.patch
          git rm -f --ignore-unmatch .github/workflows/next15-upgrade.yml .github/workflows/next16-upgrade.yml .github/workflows/next16-upgrade-v2.yml .github/workflows/security-promotion.yml

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          CONTEXT: deploy-preview
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder

      - name: Audit dependencies
        run: npm audit --json > promotion-audit.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: promotion-audit
          path: promotion-audit.json
          retention-days: 1

      - name: Commit validated promotion
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: promote validated Next.js 16 security baseline"
          git push
