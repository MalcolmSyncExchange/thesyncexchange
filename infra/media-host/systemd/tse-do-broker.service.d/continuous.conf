[Unit]
Requires=tse-do-availability.service
After=tse-do-availability.service
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
# Replaces only the old hourly service window. Per-parser deadlines, cgroups,
# financial admission and the independent finite policy-stop timer remain.
RuntimeMaxSec=infinity
Restart=on-failure
RestartSec=15
